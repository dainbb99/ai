<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4CAF50" />
    <title>스터디플랜 — 함께 만드는 학습 계획</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar" id="appHeader" hidden>
        <button class="brand" type="button" data-nav="home" aria-label="스터디 홈으로 이동"><span class="brand-mark">S</span><span>스터디플랜</span></button>
        <div class="top-actions"><span class="live"><i></i> 실시간</span><span class="avatar">나</span></div>
      </header>
      <main id="app" tabindex="-1"></main>
      <nav class="bottom-nav" id="bottomNav" hidden aria-label="주요 메뉴">
        <button data-nav="home"><span>⌂</span>스터디 홈</button>
        <button data-nav="invite"><span>♧</span>초대/팀원</button>
        <button data-nav="plan"><span>✎</span>계획 작성</button>
        <button data-nav="view"><span>▣</span>계획 보기</button>
      </nav>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
